services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    image: smartcampus:1.0
    container_name: smartcampus-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://smartcampus:smartcampus@postgres:5432/smartcampus
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
