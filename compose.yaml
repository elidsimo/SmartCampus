services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    image: smartcampus:1.1
    init: true
    container_name: smartcampus-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://smartcampus:smartcampus@postgres:5432/smartcampus
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
